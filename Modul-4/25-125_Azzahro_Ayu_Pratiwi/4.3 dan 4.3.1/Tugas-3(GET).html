<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        fieldset{
            background-color: #8fd9f8;
        }
        .field {
            display: flex;
        }
        .field label {
            width: 100px;
            text-align: left;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <h1>Registrasi</h1>
    <fieldset>
        <legend><b>Person Details</b></legend>
        <form action="Tugas-2(proses).php" method="get">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" name="username" id="username">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" name="email" id="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" name="password" id="password">
            </div>
            <div class="field">
                <label for="addres">Alamat</label>
                <textarea name="addres" id="addres"></textarea>
            </div>
            <div class="field">
                <label for="state">Provinsi</label>
                <select name="state" id="state">
                    <option value="" selected>[pilih provinsimu]</option>
                    <option value="1">Jawa Timur</option>
                    <option value="2">Jawa Tengah</option>
                    <option value="3">Jawa Barat</option>
                    <option value="4">DKI Jakarta</option>
                    <option value="5">DI Yogyakarta</option>
                    <option value="6">Banten</option>
                </select>
            </div>
            <div class="field">
                <input type="hidden" name="country" value="Indonesia">
            </div>
            <div class="field">
                <label>Jenis Kelamin</label>
                <div>
                    <input type="radio" name="gender" id="male" value="male">
                    <label for="male">Laki-laki</label>
                    <input type="radio" name="gender" id="female" value="female">
                    <label for="female">Perempuan</label>
                </div>
            </div>
            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian" id="vegetarian" value="yes">
            </div>
            <div class="field">
                <label>&nbsp;</label>
                <input type="submit" name="submit" value="Submit">
                <input type="reset" name="reset" value="Reset">
            </div>
        </form>
    </fieldset>
</body>
</html>
